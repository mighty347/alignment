# ------------------------------------------------------------------------------
# DTM Cloud Storage & Real-Time Surface Profile Sampling Settings
# ------------------------------------------------------------------------------
dtm_settings:
  storage_dir: "storage/dtm"
  db_backend: "postgres"               # "postgres" | "sqlite"
  postgres:
    host: "localhost"
    port: 5432
    dbname: "esp_db"
    user: "postgres"
    password: "postgres"
  db_path: "storage/dtm/dtm_registry.sqlite"  # Fallback SQLite path
  default_s3_bucket: "esp-railway-dtm-bucket"
  default_s3_region: "ap-south-1"
  presigned_url_expiration_seconds: 1800
  datum_margin_m: 5.0
  datum_round_m: 10.0
  max_sampling_points: 50000

# ------------------------------------------------------------------------------
# Greenfield PostgreSQL Database Repository Settings (database_schema.sql)
# Maps live platform tables (projects, project_lsections, lsection_versions,
# lsection_band_points, lsection_curves, lsection_gradients, lsection_stations,
# lsection_sheets, sites/bridges/lsections/hydrology) into CompositeDrawer.
# ------------------------------------------------------------------------------
greenfield_db:
  database_url_env: "DATABASE_URL"
  connect_timeout_s: 10
  soft_delete_sheets: true             # true -> mark old lsection_sheets as DELETED on re-run
  buildup_tolerance_m: 0.005           # m — allowable rounding tolerance on (PRL - PFL = track_buildup_m)
